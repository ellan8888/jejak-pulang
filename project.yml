name: JejakPulang
options:
  bundleIdPrefix: com.ellan8888
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RouteCore:
    path: RouteCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  JejakPulang:
    type: application
    platform: iOS
    sources:
      - path: JejakPulang
    dependencies:
      - package: RouteCore
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ellan8888.jejakpulang
        PRODUCT_NAME: JejakPulang
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
    info:
      path: JejakPulang/Info.plist
      properties:
        CFBundleDisplayName: Jejak Pulang
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: Lokasi dipakai untuk merekam jalur perjalananmu, supaya bisa dipakai lagi untuk pulang lewat jalan yang sama.
        NSLocationAlwaysAndWhenInUseUsageDescription: Lokasi dipakai untuk terus merekam jalur perjalanan walaupun layar terkunci.
        LSApplicationQueriesSchemes:
          - comgooglemaps
          - comgooglemapsurl
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPS Exchange Format
            UTTypeConformsTo:
              - public.xml
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
